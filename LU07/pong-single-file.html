    <title>Pong AI - p5.js + Neataptic</title>
    <!-- p5.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <!-- Neataptic JS Library for NEAT AI -->
    <script src="https://cdn.jsdelivr.net/npm/neataptic@1.4.7/dist/neataptic.min.js"></script>
    <style>

  <body>
    <header>
      <h1>Pong AI</h1>
      <p>
        <a href="https://en.wikipedia.org/wiki/Neuroevolution"
          >Neuroevolution</a
        >
        Simulator
      </p>
    </header>
    <main>
      <section id="dashboard" aria-label="Simulation controls and stats">
        <table id="status" aria-label="Simulation statistics">
          <thead>
            <tr>
              <th scope="col">Generation</th>
              <th scope="col">Alive</th>
              <th scope="col">High score</th>
              <th scope="col">Best bounces</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td id="hudGen">1</td>
              <td id="hudAlive">30 / 30</td>
              <td id="hudHighScore">0</td>
              <td id="hudBestBounces">0</td>
            </tr>
          </tbody>
        </table>
        <div id="speedControl">
          <label id="speedVal" for="speedSlider">Speed: 1x</label>
          <input type="range" id="speedSlider" min="1" max="20" value="1" />
        </div>
        <button id="btnReset" type="button">Reset AI</button>
      </section>

      <div id="canvas-container" aria-label="Pong simulation"></div>

      <section id="guide">
        <h2>AI inputs and scoring</h2>
        <ul>
          <li>
            Inputs (5): ball position, ball velocity, and paddle position.
          </li>
          <li>Outputs (2): move up or move down.</li>
          <li>Fitness: +0.1 per frame alive and +500 per successful return.</li>
        </ul>
      </section>
    </main>
    <script>
      class Ball {
        constructor() {
          this.reset();
        }

        reset() {
          this.x = 40;
          this.y = height / 2;
          this.r = 8;
          const angle = random(-0.5, 0.5);
          const speed = 7;
          this.vx = cos(angle) * speed;
          this.vy = sin(angle) * speed;
        }

        update() {
          this.x += this.vx;
          this.y += this.vy;

          // Bounce off Top and Bottom boundaries
          if (this.y - this.r <= 0) {
            this.y = this.r;
            this.vy *= -1;
          } else if (this.y + this.r >= height) {
            this.y = height - this.r;
            this.vy *= -1;
          }

          // Bounce off Left Wall
          if (this.x - this.r <= 0) {
            this.x = this.r;
            this.vx *= -1;
          }
        }

        show() {
          fill(255, 0, 127);
          noStroke();
          circle(this.x, this.y, this.r * 2);
        }
      }

      class PaddleAgent {
        constructor(brain, { width, height, paddleX, paddleW, paddleH }) {
          this.brain = brain;
          this.width = width;
          this.height = height;
          this.paddleX = paddleX;
          this.paddleW = paddleW;
          this.paddleH = paddleH;
          this.reset();
        }

        reset() {
          this.y = this.height / 2 - this.paddleH / 2;
          this.alive = true;
          this.score = 0;
          this.hits = 0;
        }

        // Neural Network Decision Step
        think(ball) {
          if (!this.alive) return;

          // 5 Inputs normalized between [0, 1]
          const inputs = [
            ball.x / this.width,
            ball.y / this.height,
            (ball.vx + 15) / 30,
            (ball.vy + 15) / 30,
            this.y / (this.height - this.paddleH),
          ];

          // Activate Neural Net
          const output = this.brain.activate(inputs);

          // Decide movement
          if (output[0] > output[1] && output[0] > 0.4) {
            this.y -= 6 * output[0]; // Move UP
          } else if (output[1] > output[0] && output[1] > 0.4) {
            this.y += 6 * output[1]; // Move DOWN
          }

          // Keep paddle within canvas
          this.y = Math.max(0, Math.min(this.y, this.height - this.paddleH));

          // Survival reward
          this.score += 0.1;
        }

        show(isBest = false) {
          if (!this.alive) return;

          if (isBest) {
            fill(0, 243, 255);
            stroke(255);
            strokeWeight(1);
          } else {
            fill(0, 243, 255, 40);
            noStroke();
          }
          rect(this.paddleX, this.y, this.paddleW, this.paddleH, 4);
        }
      }

      // Simulation Constants
      const POP_SIZE = 5000;
      const PADDLE_W = 1000;
      const PADDLE_H = 1;
      let PADDLE_X;

      let neat;
      let ball;
      let paddles = [];
      let generation = 1;
      let highScore = 0;
      let highBounceCount = 0;

      // DOM elements
      let speedSlider, speedVal, hudGen, hudAlive, hudHighScore, hudBestBounces;

      function initNeat() {
        neat = new neataptic.Neat(
          5,
          2,
          null, // 5 Inputs, 2 Outputs
          {
            mutation: [
              neataptic.methods.mutation.ADD_NODE,
              neataptic.methods.mutation.SUB_NODE,
              neataptic.methods.mutation.ADD_CONN,
              neataptic.methods.mutation.SUB_CONN,
              neataptic.methods.mutation.MOD_WEIGHT,
              neataptic.methods.mutation.MOD_BIAS,
            ],
            popsize: POP_SIZE,
            mutationRate: 0.3,
            elitism: Math.round(POP_SIZE * 0.1), // Keep top 10%
            network: new neataptic.architect.Random(5, 4, 2),
          },
        );

        createPaddles();
      }

      function createPaddles() {
        paddles = [];
        for (let i = 0; i < POP_SIZE; i++) {
          paddles.push(
            new PaddleAgent(neat.population[i], {
              width,
              height,
              paddleX: PADDLE_X,
              paddleW: PADDLE_W,
              paddleH: PADDLE_H,
            }),
          );
        }
      }

      function evolvePopulation() {
        // Assign calculated fitness scores to NEAT genomes
        for (let i = 0; i < POP_SIZE; i++) {
          neat.population[i].score = paddles[i].score;
        }

        neat.sort();

        // Track high score
        if (neat.population[0].score > highScore) {
          highScore = Math.floor(neat.population[0].score);
        }

        const newPopulation = [];

        // Elitism: Pass best performing brains directly
        for (let i = 0; i < neat.elitism; i++) {
          newPopulation.push(neat.population[i]);
        }

        // Mutate and produce offspring for the rest
        for (let i = 0; i < POP_SIZE - neat.elitism; i++) {
          newPopulation.push(neat.getOffspring());
        }

        neat.population = newPopulation;
        neat.mutate();
        generation++;

        createPaddles();
        ball.reset();
      }

      function setup() {
        // Create canvas and attach to HTML div
        const canvas = createCanvas(760, 420);
        canvas.parent("canvas-container");

        PADDLE_X = width - 35;

        // Cache DOM Elements
        speedSlider = document.getElementById("speedSlider");
        speedVal = document.getElementById("speedVal");
        hudGen = document.getElementById("hudGen");
        hudAlive = document.getElementById("hudAlive");
        hudHighScore = document.getElementById("hudHighScore");
        hudBestBounces = document.getElementById("hudBestBounces");

        // Setup Buttons
        document.getElementById("btnReset").onclick = () => {
          generation = 1;
          highScore = 0;
          highBounceCount = 0;
          initNeat();
          ball.reset();
        };

        // Initialize Game Objects & AI
        ball = new Ball();
        initNeat();
      }

      function draw() {
        background(13, 17, 23);

        // Read Speed Multiplier Slider
        const speedMultiplier = parseInt(speedSlider.value);
        speedVal.innerText = `Speed: ${speedMultiplier}x`;

        // Run Physics Updates multiple times per frame for fast-forward training
        for (let s = 0; s < speedMultiplier; s++) {
          updatePhysics();
        }

        ball.show();

        // Find current best living paddle for highlight rendering
        let bestPaddle = null;
        let maxScore = -1;
        paddles.forEach((p) => {
          if (p.alive && p.score > maxScore) {
            maxScore = p.score;
            bestPaddle = p;
          }
        });

        paddles.forEach((p) => p.show(p === bestPaddle));

        // Update UI Stats
        const aliveCount = paddles.filter((p) => p.alive).length;
        hudGen.innerText = generation;
        hudAlive.innerText = `${aliveCount} / ${POP_SIZE}`;
        hudHighScore.innerText = highScore;
        hudBestBounces.innerText = highBounceCount;
      }

      function updatePhysics() {
        ball.update();

        let aliveCount = 0;
        let ballHitByPaddle = false;

        const isAtPaddleX =
          ball.x + ball.r >= PADDLE_X &&
          ball.x - ball.r <= PADDLE_X + PADDLE_W &&
          ball.vx > 0;

        paddles.forEach((paddle) => {
          if (!paddle.alive) return;
          aliveCount++;

          // AI Neural Network Think Step
          paddle.think(ball);

          // Collision Detection when ball reaches paddle plane
          if (isAtPaddleX) {
            if (ball.y >= paddle.y - 5 && ball.y <= paddle.y + PADDLE_H + 5) {
              paddle.score += 500; // Reward for hit
              paddle.hits++;
              highBounceCount = Math.max(highBounceCount, paddle.hits);
              ballHitByPaddle = true;
            } else {
              paddle.alive = false; // Missed
            }
          }
        });

        // Bounce ball if at least 1 paddle made contact
        if (ballHitByPaddle) {
          ball.vx = -Math.abs(ball.vx) * 1.03;
          if (Math.abs(ball.vx) > 16) ball.vx = -16;
        }

        // If ball passes right wall or all paddles died -> Evolve
        if (ball.x > width || aliveCount === 0) {
          evolvePopulation();
        }
      }

      window.setup = setup;
      window.draw = draw;
    </script>
  </body>
