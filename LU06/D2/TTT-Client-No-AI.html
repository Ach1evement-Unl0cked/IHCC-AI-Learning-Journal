        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Tic-Tac-Toe</title>
        <style>
            body {
                max-width: 420px;
                margin: 30px auto;
                font-family: sans-serif;
                text-align: center;
            }

            table {
                border-collapse: collapse;
                margin: 20px auto;
            }

            td {
                width: 100px;
                height: 100px;
                text-align: center;
                vertical-align: middle;
                border: 1px solid #333;
            }

            button {
                width: 100%;
                height: 100%;
                font-size: 24px;
                cursor: pointer;
            }

            #start-game {
                width: auto;
                padding: 10px 18px;
            }

            #status {
                min-height: 1.5em;
            }
        </style>

    <body>
        <h1>Tic-Tac-Toe Game</h1>
        <p id="status" aria-live="polite">
            Start a game to let the AI play first.
        </p>
        <button id="start-game" type="button">Start Game</button>
        <table>
            <tr>
                <td>
                    <button
                        type="button"
                        data-row="0"
                        data-col="0"
                        aria-label="Row 1, column 1"
                    ></button>
                </td>
                <td>
                    <button
                        type="button"
                        data-row="0"
                        data-col="1"
                        aria-label="Row 1, column 2"
                    ></button>
                </td>
                <td>
                    <button
                        type="button"
                        data-row="0"
                        data-col="2"
                        aria-label="Row 1, column 3"
                    ></button>
                </td>
            </tr>
            <tr>
                <td>
                    <button
                        type="button"
                        data-row="1"
                        data-col="0"
                        aria-label="Row 2, column 1"
                    ></button>
                </td>
                <td>
                    <button
                        type="button"
                        data-row="1"
                        data-col="1"
                        aria-label="Row 2, column 2"
                    ></button>
                </td>
                <td>
                    <button
                        type="button"
                        data-row="1"
                        data-col="2"
                        aria-label="Row 2, column 3"
                    ></button>
                </td>
            </tr>
            <tr>
                <td>
                    <button
                        type="button"
                        data-row="2"
                        data-col="0"
                        aria-label="Row 3, column 1"
                    ></button>
                </td>
                <td>
                    <button
                        type="button"
                        data-row="2"
                        data-col="1"
                        aria-label="Row 3, column 2"
                    ></button>
                </td>
                <td>
                    <button
                        type="button"
                        data-row="2"
                        data-col="2"
                        aria-label="Row 3, column 3"
                    ></button>
                </td>
            </tr>
        </table>
        <script>
            const board = [
                ['', '', ''],
                ['', '', ''],
                ['', '', ''],
            ];

            const cells = document.querySelectorAll('td button');
            const startButton = document.querySelector('#start-game');
            const statusText = document.querySelector('#status');
            let gameActive = false;
            let aiThinking = false;

            for (const cell of cells) {
                cell.addEventListener('click', handleCellClick);
            }

            startButton.addEventListener('click', startGame);
            renderBoard();

            function renderBoard() {
                for (const cell of cells) {
                    const row = Number(cell.dataset.row);
                    const col = Number(cell.dataset.col);
                    cell.textContent = board[row][col];
                    cell.disabled =
                        !gameActive || aiThinking || board[row][col] !== '';
                }
            }

            function setStatus(message) {
                statusText.textContent = message;
            }

            async function startGame() {
                for (let row = 0; row < 3; row += 1) {
                    board[row].fill('');
                }

                gameActive = true;
                startButton.disabled = true;
                setStatus('AI is choosing its first move...');
                await makeAIMove();
            }

            async function handleCellClick(event) {
                if (!gameActive || aiThinking) return;

                const row = Number(event.currentTarget.dataset.row);
                const col = Number(event.currentTarget.dataset.col);
                if (board[row][col] !== '') return;

                board[row][col] = 'O';
                renderBoard();

                if (finishIfOver()) return;

                await makeAIMove();
            }

            function makeAIMove() {
                aiThinking = true;
                renderBoard();

                const winningLines = [
                    [
                        [0, 0],
                        [0, 1],
                        [0, 2],
                    ],
                    [
                        [1, 0],
                        [1, 1],
                        [1, 2],
                    ],
                    [
                        [2, 0],
                        [2, 1],
                        [2, 2],
                    ],
                    [
                        [0, 0],
                        [1, 0],
                        [2, 0],
                    ],
                    [
                        [0, 1],
                        [1, 1],
                        [2, 1],
                    ],
                    [
                        [0, 2],
                        [1, 2],
                        [2, 2],
                    ],
                    [
                        [0, 0],
                        [1, 1],
                        [2, 2],
                    ],
                    [
                        [0, 2],
                        [1, 1],
                        [2, 0],
                    ],
                ];

                function findWinningMove(player) {
                    for (let row = 0; row < 3; row += 1) {
                        for (let col = 0; col < 3; col += 1) {
                            if (board[row][col] !== '') continue;

                            board[row][col] = player;
                            const wins = winningLines.some((line) =>
                                line.every(
                                    ([lineRow, lineCol]) =>
                                        board[lineRow][lineCol] === player,
                                ),
                            );
                            board[row][col] = '';

                            if (wins) return [row, col];
                        }
                    }
                    return null;
                }

                const preferredMoves = [
                    [1, 1],
                    [0, 0],
                    [0, 2],
                    [2, 0],
                    [2, 2],
                    [0, 1],
                    [1, 0],
                    [1, 2],
                    [2, 1],
                ];
                const move =
                    findWinningMove('X') ||
                    findWinningMove('O') ||
                    preferredMoves.find(([row, col]) => board[row][col] === '');

                if (!move) {
                    aiThinking = false;
                    return;
                }

                const [row, col] = move;
                board[row][col] = 'X';
                aiThinking = false;

                if (!finishIfOver()) setStatus('Your turn (O).');
                renderBoard();
            }

            function finishIfOver() {
                const lines = [
                    ...board,
                    [board[0][0], board[1][0], board[2][0]],
                    [board[0][1], board[1][1], board[2][1]],
                    [board[0][2], board[1][2], board[2][2]],
                    [board[0][0], board[1][1], board[2][2]],
                    [board[0][2], board[1][1], board[2][0]],
                ];
                const winner = lines.find(
                    (line) =>
                        line[0] !== '' &&
                        line.every((cell) => cell === line[0]),
                )?.[0];

                if (winner) {
                    gameActive = false;
                    setStatus(winner === 'X' ? 'The AI wins.' : 'You win!');
                } else if (
                    board.every((row) => row.every((cell) => cell !== ''))
                ) {
                    gameActive = false;
                    setStatus("It's a draw.");
                } else {
                    return false;
                }

                startButton.textContent = 'Play Again';
                startButton.disabled = false;
                renderBoard();
                return true;
            }
        </script>
    </body>
</html>
